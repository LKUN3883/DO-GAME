name: Game smoke tests
on:
  push:
    branches:
      - main
      - repair/blueprint-bugs-pass1
      - repair/grapple-ch14
  pull_request:
    branches:
      - main
      - repair/blueprint-bugs-pass1
permissions:
  contents: read
jobs:
  smoke:
    name: Node smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore LF fixture files for text assertions
        if: runner.os == 'Windows'
        run: git -c core.autocrlf=false checkout -- docs/spec/BLUEPRINT_v1.3.2d-e_FINAL.md docs/level_train_v1.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/game.js
      - run: npm ci
      - run: npm test
  chromium:
    name: Chromium acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Create screenshot directory
        run: node -e "require('node:fs').mkdirSync('test-artifacts',{recursive:true})"
      - run: npm run test:browser
        env:
          BROWSER_SCREENSHOT: test-artifacts/boss-room.png
      - run: npm run test:browser:grapple
        if: ${{ !cancelled() }}
      - run: npm run test:playthrough
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-acceptance-${{ matrix.os }}
          path: |
            test-artifacts/*.png
            browser-results/
          if-no-files-found: warn
