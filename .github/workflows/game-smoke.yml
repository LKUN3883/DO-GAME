name: Game smoke tests
on:
  push:
    branches:
      - repair/blueprint-bugs-pass1
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/game.js
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test-artifacts
      - run: npm run test:browser
        env:
          BROWSER_SCREENSHOT: test-artifacts/boss-room.png
      - run: npm run test:playthrough
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-boss-room-screenshot
          path: test-artifacts/*.png
          if-no-files-found: warn
