name: Game smoke tests
on:
  push:
    branches:
      - repair/blueprint-bugs-pass1
      - repair/grapple-ch14
  pull_request:
    branches:
      - main
      - repair/blueprint-bugs-pass1
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/game.js
      - run: node --test tests/*.test.cjs
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/playtest.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-playtest
          path: browser-results/
          if-no-files-found: ignore
